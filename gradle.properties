android.useAndroidX=true
android.nonFinalResIds=false
kotlin.code.style=official
# Memory-tuned for constrained CI/sandbox environments (3.5-4 GB cgroup):
# one JVM doing Gradle + Kotlin in-process + R8 instead of separate daemons,
# which caused OOM kills during minifyReleaseWithR8.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=2
org.gradle.parallel=false
