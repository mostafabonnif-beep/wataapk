name: Deploy admin panel to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "assets/**"
      - "privacy.html"
      - "scripts/build-hosting.js"
      - ".github/workflows/deploy-admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the restricted hosting artifact
        run: node scripts/build-hosting.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload admin artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: admin/hosting-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
