version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      androidx:
        patterns:
          - "androidx*"
          - "com.android*"
      compose:
        patterns:
          - "androidx.compose*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"
    ignore:
      # ترقيات AGP الكبرى تتطلب فحص التوافق مع Gradle wrapper والـ JDK
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      # ترقيات Kotlin الكبرى تتطلب فحص التوافق مع Compose/KSP
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
